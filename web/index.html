<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบติดตามและติดตามผลการส่งเสริมสหกรณ์/กลุ่มเกษตรกร จังหวัดชลบุรี ปีงบประมาณ พ.ศ. 2570</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="css/cpd.css" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; }
    .card-header { font-weight: 700; background-color: #1b5e20; color: white; }
    .score-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px; padding: 12px; }
    textarea { font-size: 0.88rem; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="text-center mb-4">
    <h3 class="fw-bold text-success">ระบบติดตามการส่งเสริมสหกรณ์/กลุ่มเกษตรกร จังหวัดชลบุรี ประจำปีงบประมาณ พ.ศ. 2570</h3>
    <p class="text-muted">สำนักงานสหกรณ์จังหวัดชลบุรี</p>
  </div>

  <!-- แถบเมนู 3 หน้า: Dashboard / ทะเบียนคุมเอกสาร / ความเข้มแข็ง -->
  <nav class="cpd-tabbar mb-4 no-print" id="cpdTabBar">
    <button type="button" class="cpd-tab-btn active" data-action="switch-tab" data-tab="dashboard">
      <span class="cpd-tab-icon">📊</span><span>1. Dashboard สรุปภาพรวมจังหวัดชลบุรี</span>
    </button>
    <button type="button" class="cpd-tab-btn" data-action="switch-tab" data-tab="registry">
      <span class="cpd-tab-icon">📁</span><span>2. ทะเบียนคุมเอกสาร/รายงาน</span>
    </button>
    <button type="button" class="cpd-tab-btn" data-action="switch-tab" data-tab="strength">
      <span class="cpd-tab-icon">💪</span><span>3. ความเข้มแข็งสหกรณ์/กลุ่มเกษตรกร</span>
    </button>
  </nav>

  <!-- 3 หน้า: โครงสร้างถูกสร้างโดย js/cpd-ui.js -->
  <div id="tab-dashboard" class="cpd-tab-pane active"></div>
  <div id="tab-registry" class="cpd-tab-pane"></div>
  <div id="tab-strength" class="cpd-tab-pane"></div>
</div>

<!-- GitHub Pages: โหลด config + shim ก่อนโค้ด UI เสมอ (ห้ามสลับลำดับ) -->
<script src="config.js"></script>
<script src="js/google-script-shim.js"></script>

<script>
  // masterCoops is used by fallbackDashboard() and the strength page (2569 results).
  // Loaded through the existing getMasterCoopList() RPC; no legacy form dropdown.
  var masterCoops = [];
  function loadMasterCoops() {
    try {
      if (!globalThis.google || !google.script || !google.script.run) return;
      google.script.run
        .withSuccessHandler(function (data) {
          masterCoops = Array.isArray(data) ? data : [];
          globalThis.masterCoops = masterCoops;
          if (globalThis.CPD_UI && typeof globalThis.CPD_UI.loadDashboard === 'function') {
            globalThis.CPD_UI.loadDashboard(true);
          }
        })
        .withFailureHandler(function (err) {
          masterCoops = [];
          globalThis.masterCoops = masterCoops;
          console.warn('[masterCoops]', err && err.message ? err.message : err);
        })
        .getMasterCoopList();
    } catch (e) {
      console.warn('[masterCoops]', e);
    }
  }
  window.addEventListener('load', loadMasterCoops);
</script>

<script src="js/cpd-report-registry.js?v=20261120a"></script>
<script src="js/cpd-state.js?v=20261120a"></script>
<script src="js/cpd-mis-reports.js?v=20261120a"></script>
<script src="js/cpd-ui.js?v=20261120a"></script>
</body>
</html>
